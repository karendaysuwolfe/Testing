header{padding:26px 20px;background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}

.layout{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}

let currentQuestion=1; const state={};
function renderSingleRow(q){const temp=document.createElement('div'); temp.innerHTML=allRows; const target=temp.querySelector(`#question-${q}`); return target?target.outerHTML:'';}
function showQuestion(q){currentQuestion=q; document.getElementById('navNow').textContent=q; document.getElementById('qTitle').textContent=`Question ${q}`; document.getElementById('singleQuestionArea').innerHTML=renderSingleRow(q); restoreState(q); const fb=document.getElementById('feedbackBox'); fb.className='feedback'; fb.innerHTML='';}
function saveState(q){if(types[q]==='MC'){const c=document.querySelector(`#singleQuestionArea input[name="q${q}"]:checked`); state[q]=c?c.value:'';} else {state[q]=document.getElementById(`q${q}`).value;}}
function restoreState(q){if(!(q in state)) return; if(types[q]==='MC'){const input=document.querySelector(`#singleQuestionArea input[name="q${q}"][value="${state[q]}"]`); if(input) input.checked=true;} else {const i=document.getElementById(`q${q}`); if(i) i.value=state[q]||'';}}
function getCurrentResponse(){if(types[currentQuestion]==='MC'){const c=document.querySelector(`#singleQuestionArea input[name="q${currentQuestion}"]:checked`); return c?c.value:'';} const i=document.getElementById(`q${currentQuestion}`); return i?i.value:'';}
function checkCurrent(){const q=currentQuestion; saveState(q); const r=getCurrentResponse(); const ok=isCorrect(q,r); const fb=document.getElementById('feedbackBox'); fb.className=ok?'feedback good':'feedback bad'; fb.innerHTML=`<strong>${ok?'Correct':'Not quite'}</strong><br>Correct answer: <strong>${formatCorrect(q)}</strong><div style="margin-top:8px">${explanations[q]}</div>`; state[`graded_${q}`]=ok; updateProgress();}
function updateProgress(){const keys=Object.keys(state).filter(k=>k.startsWith('graded_')); const ans=keys.length; const correct=keys.filter(k=>state[k]).length; document.getElementById('progressScore').textContent=`${correct} / ${ans}`; document.getElementById('progressAnswered').textContent=ans;}
function nextQuestion(){saveState(currentQuestion); if(currentQuestion<45) showQuestion(currentQuestion+1);}
function prevQuestion(){saveState(currentQuestion); if(currentQuestion>1) showQuestion(currentQuestion-1);}
showQuestion(1); updateProgress();
