
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DNA Fingerprinting Quiz</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}
.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 12px;
}
button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #334155;
}
.correct {
    background: #065f46 !important;
}
.incorrect {
    background: #7f1d1d !important;
}
.next-btn {
    margin-top: 15px;
    background: #2563eb;
    color: white;
}
</style>
</head>
<body>

<div class="container">
<div class="card">
<h2 id="question"></h2>
<div id="answers"></div>
<p id="explanation"></p>
<button id="nextBtn" class="next-btn" onclick="nextQuestion()">Next Question</button>
<h3 id="score"></h3>
</div>
</div>

<script>

const baseTopics = [
"STRs are repeated DNA sequences used for identification.",
"PCR copies DNA so scientists can analyze small samples.",
"Gel electrophoresis separates DNA fragments by size.",
"VNTR regions vary between individuals.",
"DNA fingerprinting helps forensic investigations.",
"DNA fingerprinting confirms biological relationships.",
"Identical twins share nearly identical DNA.",
"Restriction enzymes cut DNA at specific sequences.",
"Smaller fragments travel farther in gel.",
"Banding patterns are compared between samples."
];

let questions = [];

for(let i=1;i<=100;i++){
    let correct = baseTopics[i % baseTopics.length];
    questions.push({
        question: `DNA Fingerprinting Question ${i}: Which statement is correct?`,
        options:[
            "DNA fingerprinting changes DNA",
            correct,
            "Everyone has identical DNA",
            "DNA fingerprinting uses physical fingerprints only"
        ],
        answer:1,
        explanation:`Correct answer: "${correct}". DNA profiling compares natural DNA differences. It does not change DNA, people do not share identical DNA patterns, and it uses genetic material—not fingerprints.`
    });
}

let current = 0;
let score = 0;

function showQuestion(){
    const q = questions[current];
    document.getElementById("question").innerText = q.question;

    let answersHTML = "";
    q.options.forEach((option, index)=>{
        answersHTML += `<button onclick="checkAnswer(${index})">${option}</button>`;
    });

    document.getElementById("answers").innerHTML = answersHTML;
    document.getElementById("explanation").innerText = "";
}

function checkAnswer(index){
    const q = questions[current];
    const buttons = document.querySelectorAll("#answers button");

    if(index === q.answer){
        buttons[index].classList.add("correct");
        score++;
    } else {
        buttons[index].classList.add("incorrect");
        buttons[q.answer].classList.add("correct");
    }

    document.getElementById("explanation").innerText = q.explanation;
}

function nextQuestion(){
    current++;

    if(current >= questions.length){
        document.querySelector(".card").innerHTML =
        `<h2>Quiz Complete</h2>
         <h3>Your Score: ${score}/100</h3>
         <button onclick="location.reload()">Try Again</button>`;
        return;
    }

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
